name: Exécuter mon script Python

# 1. Définir quand l'action se déclenche
on:
  push:
    branches: [ main, master ]  # Se lance à chaque push sur main ou master
  # workflow_dispatch:        # Permet aussi de le lancer manuellement depuis l'onglet Actions de GitHub

# 2. Définir les tâches à exécuter
jobs:
  run-python-script:
    runs-on: ubuntu-latest  # Utilise un serveur virtuel Linux géré par GitHub

    steps:
      # Étape 1 : Récupérer le code de votre dépôt
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Étape 2 : Installer Python sur le serveur virtuel
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Étape 3 : Installer les dépendances (si vous avez un requirements.txt)
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Étape 4 : Exécuter votre script (remplacez 'main.py' par le nom de votre fichier)
      - name: Lancer le script
        run: python app/dashbord.py